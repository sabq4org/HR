<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1264a3" />
    <meta
      name="description"
      content="مساحة فريق سبق للملف الوظيفي والإجازات والموافقات — تجربة محلية ببيانات اصطناعية."
    />
    <link rel="icon" type="image/svg+xml" href="/brand/sabq-mark.svg" />
    <title>سبق | مساحة الفريق</title>
    <script>
      // Apply the saved appearance before the first paint (src/theme/theme.ts keeps it in step).
      (function () {
        var choice = 'system';
        try {
          choice = localStorage.getItem('sabq-theme') || 'system';
        } catch (e) {}
        var dark =
          choice === 'dark' ||
          (choice !== 'light' &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
